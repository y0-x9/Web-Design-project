      <p class="eyebrow">Course catalog</p>
      <h1>Course details and prerequisites</h1>
      <p>Search the course list and check which classes should be completed before registration.</p>
    </section>

    <!-- Search and filter controls for courses -->
    <section class="section">
      <div class="filter-bar">
        <label for="courseSearch">Search courses</label>
        <input id="courseSearch" type="search" placeholder="Search by code or title">
        <label for="levelFilter">Level</label>
        <select id="levelFilter">
          <option value="all">All levels</option>
          <option value="100">100 level</option>
          <option value="200">200 level</option>
          <option value="300">300 level</option>
          <option value="400">400 level</option>
        </select>
      </div>
      <div id="courseCatalog" class="course-grid"></div>
    </section>
